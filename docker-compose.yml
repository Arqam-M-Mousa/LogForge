services:
  app:
    build:
      context: .
      dockerfile: LogForge.API/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
      RabbitMq__ConnectionString: amqp://guest:guest@rabbitmq:5672/
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=logforge;Username=postgres;Password=postgres;
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || curl -f http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  postgres:
    image: postgres:latest
    restart: unless-stopped
    command: [
      "postgres",
      "-c", "max_connections=40",
      "-c", "shared_buffers=256MB",
      "-c", "synchronous_commit=false",
      "-c", "checkpoint_completion_target=0.9",
      "-c", "checkpoint_timeout=5min",
      "-c", "wal_buffers=16MB",
      "-c", "max_wal_size=4GB"
    ]
    environment:
      POSTGRES_DB: logforge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d logforge"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1024M

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

volumes:
  postgres_data:
