services:
  app:
    build:
      context: .
      dockerfile: LogForge.API/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=logforge;Username=postgres;Password=postgres;Maximum Pool Size=15;Minimum Pool Size=4;Timeout=20;Command Timeout=20
      RabbitMq__ConnectionString: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || curl -f http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  postgres:
    image: postgres:latest
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=40", "-c", "shared_buffers=256MB", "-c", "synchronous_commit=off", "-c", "effective_cache_size=768MB", "-c", "work_mem=8MB", "-c", "maintenance_work_mem=128MB", "-c", "wal_buffers=16MB", "-c", "max_wal_size=4GB", "-c", "max_parallel_workers_per_gather=0", "-c", "checkpoint_timeout=15min", "-c", "checkpoint_completion_target=0.9", "-c", "jit=off", "-c", "random_page_cost=1.1"]
    environment:
      POSTGRES_DB: logforge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d logforge"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1024M

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

volumes:
  postgres_data:
